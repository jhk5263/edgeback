name: Sync from jhk5263/edgetunnel

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write   # ← 加上这一行
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup local config files
        run: |
          # 备份你的个人配置文件
          if [ -f wrangler.toml ]; then
            cp wrangler.toml wrangler.toml.backup
          fi

      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/jhk5263/edgetunnel.git
          git fetch upstream
          
          # 自动检测默认分支
          DEFAULT_BRANCH=$(git remote show upstream | grep 'HEAD branch' | cut -d' ' -f5)
          echo "Default branch: $DEFAULT_BRANCH"
          
          # 强制同步上游（覆盖所有文件）
          git reset --hard upstream/$DEFAULT_BRANCH
          
          # 恢复你的个人配置文件
          if [ -f wrangler.toml.backup ]; then
            mv wrangler.toml.backup wrangler.toml
            git add wrangler.toml
            git commit -m "Restore personal wrangler.toml config" --no-verify
          fi
          
          git push origin $DEFAULT_BRANCH --force
